const KEY='hiddenYardAccountsV4';
let db=load(); let view='home'; let historyFilter='All'; let searchTerm='';
function today(){return new Date().toISOString().slice(0,10)}
function money(n){return '₹'+Math.round(Number(n)||0).toLocaleString('en-IN')}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function load(){try{let raw=localStorage.getItem(KEY); if(raw){let x=JSON.parse(raw); if(x.seedVersion===SEED_VERSION)return x}}catch(e){} return {seedVersion:SEED_VERSION,transactions:SEED.map(x=>({...x}))}}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function sales(){return db.transactions.filter(x=>x.type==='Sale')}
function expenses(){return db.transactions.filter(x=>x.type==='Expense')}
function wages(){return db.transactions.filter(x=>x.type==='Wage')}
function sum(a){return a.reduce((s,x)=>s+Number(x.amount||0),0)}
function day(d){return db.transactions.filter(x=>x.date===d)}
function metrics(d=today()){let a=day(d), s=sales().filter(x=>x.date===d), e=expenses().filter(x=>x.date===d), w=wages().filter(x=>x.date===d); return {cash:sum(s.filter(x=>/Physical Cash/i.test(x.description))),upi:sum(s.filter(x=>/UPI/i.test(x.description))),sales:sum(s),expenses:sum(e),wages:sum(w),net:sum(s)-sum(e)-sum(w)}}
function render(){document.getElementById('topDate').textContent=new Date().toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short',year:'numeric'}); document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active')); let n=document.getElementById('n-'+view); if(n)n.classList.add('active'); ({home:renderHome,history:renderHistory,more:renderMore}[view]||renderHome)();}
function renderHome(){let m=metrics(), recent=[...db.transactions].sort((a,b)=>(b.date+b.id).localeCompare(a.date+a.id)).slice(0,7); let allSales=sum(sales()), allExp=sum(expenses())+sum(wages()); document.getElementById('app').innerHTML=`<section class="hero"><div class="eyebrow">TODAY · ${new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'short'})}</div><h1>${money(m.sales)}</h1><div class="heroGrid"><div class="heroStat"><span>Physical Cash</span><b>${money(m.cash)}</b></div><div class="heroStat"><span>UPI</span><b>${money(m.upi)}</b></div></div></section><div class="quick"><button onclick="openAdd('cash')"><span class="qicon">₹</span><span class="qlabel">Cash Sale</span></button><button onclick="openAdd('upi')"><span class="qicon">⌁</span><span class="qlabel">UPI Sale</span></button><button onclick="openAdd('expense')"><span class="qicon">−</span><span class="qlabel">Expense</span></button><button onclick="openAdd('wage')"><span class="qicon">○</span><span class="qlabel">Wage</span></button></div><div class="stats"><div class="card mini"><span>Expenses</span><b>${money(m.expenses)}</b></div><div class="card mini"><span>Wages</span><b>${money(m.wages)}</b></div><div class="card mini"><span>Net today</span><b class="${m.net>=0?'green':'red'}">${money(m.net)}</b></div></div><section class="section"><div class="sectionHead"><h2>Today</h2><button class="link" onclick="closeDay()">Close day →</button></div><div class="card activity">${recent.filter(x=>x.date===today()).length?recent.filter(x=>x.date===today()).map(row).join(''):'<div class="empty">No entries yet today</div>'}</div></section><section class="section"><div class="sectionHead"><h2>Business snapshot</h2><button class="link" onclick="go('more')">View reports</button></div><div class="card mini"><span>Since 1 Aug</span><b>${money(allSales)} sales</b><div class="rowsub">${money(allExp)} expenses & wages · ${db.transactions.length} transactions</div></div></section>`}
function row(x){let sale=x.type==='Sale',w=x.type==='Wage';return `<div class="row" onclick="editTx('${esc(x.id)}')"><span class="dot ${sale?'sale':w?'wage':'expense'}"></span><div class="rowmain"><div class="rowtitle">${esc(x.description||x.type)}</div><div class="rowsub">${esc(x.funding||'')} ${x.party?'· '+esc(x.party):''}</div></div><div class="amt ${sale?'plus':'minus'}">${sale?'+':'−'}${money(x.amount)}</div></div>`}
function renderHistory(){let a=[...db.transactions].sort((x,y)=>(y.date+y.id).localeCompare(x.date+x.id)); if(historyFilter!=='All')a=a.filter(x=>x.type===historyFilter); if(searchTerm)a=a.filter(x=>(x.description+' '+x.category+' '+x.funding+' '+x.party).toLowerCase().includes(searchTerm.toLowerCase())); let groups={};a.forEach(x=>(groups[x.date]??=[]).push(x)); document.getElementById('app').innerHTML=`<div class="viewTitle">Activity</div><div class="search"><input id="histSearch" value="${esc(searchTerm)}" placeholder="Search transactions…" oninput="searchTerm=this.value;renderHistory()"></div><div class="chips">${['All','Sale','Expense','Wage','Receivable','Receivable Recovery'].map(f=>`<button class="chip ${historyFilter===f?'on':''}" onclick="historyFilter='${f}';renderHistory()">${f==='Sale'?'Sales':f}</button>`).join('')}</div>${Object.keys(groups).length?Object.entries(groups).map(([d,items])=>`<div class="dayHead"><b>${new Date(d+'T00:00:00').toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'})}</b><span>${money(sum(items.filter(x=>x.type==='Sale')))} sales · ${money(sum(items.filter(x=>x.type!=='Sale')))} out</span></div><div class="card activity">${items.map(row).join('')}</div>`).join(''):'<div class="card empty">No transactions found</div>'}`}
function renderMore(){let m=metrics();document.getElementById('app').innerHTML=`<div class="viewTitle">Control centre</div><div class="banner"><b>Today closed view</b><br>${money(m.sales)} sales · ${money(m.expenses+m.wages)} operating outflow. Use Close Day to verify physical cash.</div><div class="moreGrid"><button class="moreItem" onclick="reports()"><b>Reports</b><span>Sales, cash, expenses & trends</span></button><button class="moreItem" onclick="exportXls()"><b>Export Excel</b><span>Download current ledger</span></button><button class="moreItem" onclick="backup()"><b>Backup</b><span>Save a local JSON copy</span></button><button class="moreItem" onclick="document.getElementById('restore').click()"><b>Restore</b><span>Load a previous backup</span></button><button class="moreItem" onclick="inventory()"><b>Inventory</b><span>Stock and reorder control</span></button><button class="moreItem" onclick="margins()"><b>Product margins</b><span>Cost and gross margin</span></button><button class="moreItem" onclick="owner()"><b>Owner funding</b><span>Personal payments into café</span></button><button class="moreItem" onclick="supplier()"><b>Pending / Suppliers</b><span>Credit and outstanding</span></button></div><input type="file" id="restore" accept="application/json" style="display:none" onchange="restore(this)">`}
function openSearch(){go('history');setTimeout(()=>document.getElementById('histSearch')?.focus(),50)}
function go(v){view=v;render()}
function openAdd(kind){let mode=kind==='cash'?'Cash Sale':kind==='upi'?'UPI Sale':kind==='expense'?'Expense':kind==='wage'?'Wage':null; document.getElementById('sheetContent').innerHTML=mode?formFor(mode):`<div class="sheetTitle">Quick add</div><div class="choiceGrid"><button class="choice" onclick="openAdd('cash')"><b>₹ Cash Sale</b><span>Physical cash received</span></button><button class="choice" onclick="openAdd('upi')"><b>⌁ UPI Sale</b><span>UPI / bank received</span></button><button class="choice" onclick="openAdd('expense')"><b>− Expense</b><span>Ingredients, utilities, etc.</span></button><button class="choice" onclick="openAdd('wage')"><b>○ Wage</b><span>Employee payment</span></button><button class="choice" onclick="formForExtra('Owner Funding')"><b>＋ Owner funding</b><span>Owner-paid or injected</span></button><button class="choice" onclick="formForExtra('Supplier Credit')"><b>◌ Supplier credit</b><span>Record unpaid purchase</span></button></div>`;document.getElementById('sheet').classList.add('open')}
function formFor(mode,tx={}){let sale=mode.includes('Sale'),w=mode==='Wage';return `<div class="sheetTitle">${tx.id?'Edit ':''}${mode}</div><div class="form"><div class="field"><label>Amount</label><input class="bigAmount" id="famt" type="number" inputmode="decimal" value="${tx.amount||''}" placeholder="₹ 0"></div>${sale?`<div class="field"><label>Channel</label><input value="${mode==='Cash Sale'?'Physical Cash':'UPI'}" disabled></div>`:w?`<div class="field"><label>Employee</label><input id="fparty" value="${esc(tx.party||'')}" placeholder="Employee name"></div>`:`<div class="field"><label>What was it?</label><input id="fdesc" value="${esc(tx.description||'')}" placeholder="e.g. Milk, Vegetables, Gas"></div><div class="field"><label>Paid by</label><select id="ffund"><option>Business Cash</option><option>Business Bank/UPI</option><option>Owner funded</option><option>Supplier Credit</option></select></div><div class="field"><label>Category</label><input id="fcat" value="${esc(tx.category||'Operating Expense')}" placeholder="Ingredients / Utilities / Equipment"></div>`}<div class="field"><label>Date</label><input id="fdate" type="date" value="${tx.date||today()}"></div><button class="save" onclick="saveForm('${esc(mode)}','${esc(tx.id||'')}')">Save</button>${tx.id?`<button class="secondary danger" onclick="deleteTx('${esc(tx.id)}')">Delete transaction</button>`:''}<button class="secondary" onclick="closeSheet()">Cancel</button></div>`}
function formForExtra(mode){document.getElementById('sheetContent').innerHTML=formFor(mode);}
function saveForm(mode,id){let amount=Number(document.getElementById('famt').value);if(!amount)return alert('Enter an amount');let sale=mode.includes('Sale'),w=mode==='Wage';let x=id?db.transactions.find(z=>z.id===id):null;if(!x){x={id:'tx-'+Date.now()};db.transactions.push(x)} x.date=document.getElementById('fdate').value;x.amount=amount;x.type=sale?'Sale':w?'Wage':'Expense';x.description=sale?(mode==='Cash Sale'?'Sales through Physical Cash':'Sales through UPI'):w?'Wage':(document.getElementById('fdesc').value||'Expense');x.category=sale?x.description:w?'Wages':(document.getElementById('fcat').value||'Operating Expense');x.funding=sale?(mode==='Cash Sale'?'Business Cash':'Business Bank/UPI'):w?'Business Cash':document.getElementById('ffund').value;x.party=w?(document.getElementById('fparty').value||''):'';x.status='Paid';save();closeSheet();render()}
function editTx(id){let x=db.transactions.find(z=>z.id===id);if(!x)return;document.getElementById('sheetContent').innerHTML=formFor(x.type==='Sale'?(x.description.includes('UPI')?'UPI Sale':'Cash Sale'):x.type,x);document.getElementById('sheet').classList.add('open'); if(document.getElementById('ffund'))document.getElementById('ffund').value=x.funding||'Business Cash'}
function deleteTx(id){if(confirm('Delete this transaction?')){db.transactions=db.transactions.filter(x=>x.id!==id);save();closeSheet();render()}}
function closeSheet(){document.getElementById('sheet').classList.remove('open')}
function closeDay(){let m=metrics();document.getElementById('sheetContent').innerHTML=`<div class="sheetTitle">Close ${new Date().toLocaleDateString('en-IN',{day:'numeric',month:'short'})}</div><div class="card mini" style="margin-bottom:10px"><span>Cash sales</span><b>${money(m.cash)}</b><span>Cash expenses + wages</span><b>${money(expenses().filter(x=>x.date===today()&&/Cash/i.test(x.funding)).reduce((a,x)=>a+x.amount,0)+wages().filter(x=>x.date===today()&&/Cash/i.test(x.funding)).reduce((a,x)=>a+x.amount,0))}</b><span style="display:block;margin-top:8px">Expected closing cash depends on your opening cash.</span></div><div class="field"><label>Opening cash</label><input id="openCash" type="number" inputmode="decimal" placeholder="₹ 0"></div><div class="field"><label>Actual cash counted</label><input id="actualCash" type="number" inputmode="decimal" placeholder="₹ 0"></div><button class="save" onclick="finishClose()">Check & close</button><button class="secondary" onclick="closeSheet()">Cancel</button>`;document.getElementById('sheet').classList.add('open')}
function finishClose(){let m=metrics();let open=Number(document.getElementById('openCash').value||0),actual=Number(document.getElementById('actualCash').value||0);let cashOut=expenses().filter(x=>x.date===today()&&/Cash/i.test(x.funding)).reduce((a,x)=>a+x.amount,0)+wages().filter(x=>x.date===today()&&/Cash/i.test(x.funding)).reduce((a,x)=>a+x.amount,0);let expected=open+m.cash-cashOut;alert(`Expected cash: ${money(expected)}\nActual cash: ${money(actual)}\nDifference: ${money(actual-expected)}`);closeSheet()}
function reports(){let total=sum(sales()), exp=sum(expenses()), wag=sum(wages()), cash=sum(sales().filter(x=>/Physical Cash/i.test(x.description))), upi=sum(sales().filter(x=>/UPI/i.test(x.description)));document.getElementById('sheetContent').innerHTML=`<div class="sheetTitle">Reports</div><div class="stats"><div class="card mini"><span>Sales</span><b>${money(total)}</b></div><div class="card mini"><span>Expenses</span><b>${money(exp)}</b></div><div class="card mini"><span>Wages</span><b>${money(wag)}</b></div></div><div class="section"><div class="card mini"><span>Physical cash</span><b>${money(cash)}</b><span>UPI / bank</span><b>${money(upi)}</b><span>Transactions</span><b>${db.transactions.length}</b></div></div><button class="save" onclick="closeSheet()">Done</button>`;document.getElementById('sheet').classList.add('open')}
function backup(){let b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='Hidden_Yard_Backup_'+today()+'.json';a.click()}
function restore(inp){let f=inp.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.transactions)throw 0;db=x;save();render();alert('Backup restored')}catch(e){alert('Invalid backup')}};r.readAsText(f)}
function exportXls(){let rows=[['Date','Type','Description','Amount','Category','Funding','Party / Supplier','Status'],...db.transactions.map(x=>[x.date,x.type,x.description,x.amount,x.category,x.funding,x.party,x.status])];let html='<table>'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>').join('')+'</table>';let blob=new Blob(['<html><body>'+html+'</body></html>'],{type:'application/vnd.ms-excel'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Hidden_Yard_Transactions_'+today()+'.xls';a.click()}
function showTable(title,cols,rows){document.getElementById('sheetContent').innerHTML=`<div class="sheetTitle">${title}</div><div class="card tableWrap"><table class="table"><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${esc(r[c])}</td>`).join('')}</tr>`).join('')}</tbody></table></div><button class="secondary" onclick="closeSheet()">Done</button>`;document.getElementById('sheet').classList.add('open')}function inventory(){showTable('Inventory',['Item','Category','Unit','Closing Qty','Avg Cost / Unit','Reorder Level','Status'],INV.map(x=>({'Item':x.Item,'Category':x.Category,'Unit':x.Unit,'Closing Qty':x['Closing Qty'],'Avg Cost / Unit':x['Avg Cost / Unit'],'Reorder Level':x['Reorder Level'],'Status':x.Status})).filter(x=>x.Item&&!String(x.Item).startsWith('How to use')&&!String(x.Item).startsWith('Opening')))}function margins(){showTable('Product margins',['Product','Category','Selling Price','Ingredient Cost','Packaging Cost','Total Cost','Gross Profit','Margin %'],MARG.map(x=>({'Product':x.Product,'Category':x.Category,'Selling Price':money(x['Selling Price']),'Ingredient Cost':money(x['Ingredient Cost']),'Packaging Cost':money(x['Packaging Cost']),'Total Cost':money(x['Total Cost']),'Gross Profit':money(x['Gross Profit']),'Margin %':(Number(x['Margin %']||0)*100).toFixed(0)+'%'})).filter(x=>x.Product&&!String(x.Product).startsWith('How to use')&&!String(x.Product).startsWith('Enter the actual')))}function owner(){let a=expenses().filter(x=>/Owner funded/i.test(x.funding));showTable('Owner funded',['Date','Description','Amount','Category'],a.map(x=>({'Date':x.date,'Description':x.description,'Amount':money(x.amount),'Category':x.category})))}function supplier(){let a=db.transactions.filter(x=>/Credit|Pending/i.test(x.funding)||/pending/i.test(x.category));showTable('Pending / supplier',['Date','Description','Amount','Funding','Party / Supplier','Status'],a.map(x=>({'Date':x.date,'Description':x.description,'Amount':money(x.amount),'Funding':x.funding,'Party / Supplier':x.party,'Status':x.status})))}
render();
</script></body></html>
