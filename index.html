function metrics(d=today()){let a=day(d), s=sales().filter(x=>x.date===d), e=expenses().filter(x=>x.date===d), w=wages().filter(x=>x.date===d); return {cash:sum(s.filter(x=>/Physical Cash/i.test(x.description))),upi:sum(s.filter(x=>/UPI/i.test(x.description))),sales:sum(s),expenses:sum(e),wages:sum(w),net:sum(s)-sum(e)-sum(w)}}

function renderHome(){let m=metrics(), recent=[...db.transactions].sort((a,b)=>(b.date+b.id).localeCompare(a.date+a.id)).slice(0,7); let allSales=sum(sales()), allExp=sum(expenses())+sum(wages()); document.getElementById('app').innerHTML=`<section class="hero"><div class="eyebrow">TODAY · ${new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'short'})}</div><h1>${money(m.sales)}</h1><div class="heroGrid"><div class="heroStat"><span>Physical Cash</span><b>${money(m.cash)}</b></div><div class="heroStat"><span>UPI</span><b>${money(m.upi)}</b></div></div></section><div class="quick"><button onclick="openAdd('cash')"><span class="qicon">₹</span><span class="qlabel">Cash Sale</span></button><button onclick="openAdd('upi')"><span class="qicon">⌁</span><span class="qlabel">UPI Sale</span></button><button onclick="openAdd('expense')"><span class="qicon">−</span><span class="qlabel">Expense</span></button><button onclick="openAdd('wage')"><span class="qicon">○</span><span class="qlabel">Wage</span></button></div><div class="stats"><div class="card mini"><span>Expenses</span><b>${money(m.expenses)}</b></div><div class="card mini"><span>Wages</span><b>${money(m.wages)}</b></div><div class="card mini"><span>Net today</span><b class="${m.net>=0?'green':'red'}">${money(m.net)}</b></div></div><section class="section"><div class="kpiGrid"><div class="kpi"><span>Supplier payable</span><b>${money(payables().reduce((s,x)=>s+x.balance,0))}</b></div><div class="kpi"><span>Customer receivable</span><b>${money(receivables().reduce((s,x)=>s+x.balance,0))}</b></div></div></section><section class="section"><div class="sectionHead"><h2>Today</h2><button class="link" onclick="closeDay()">Close day →</button></div><div class="card activity">${recent.filter(x=>x.date===today()).length?recent.filter(x=>x.date===today()).map(row).join(''):'<div class="empty">No entries yet today</div>'}</div></section><section class="section"><div class="sectionHead"><h2>Business snapshot</h2><button class="link" onclick="go('more')">View reports</button></div><div class="card mini"><span>Since 1 Aug</span><b>${money(allSales)} sales</b><div class="rowsub">${money(allExp)} expenses & wages · ${db.transactions.length} transactions</div></div></section>`}
function row(x){let sale=x.type==='Sale',w=x.type==='Wage';return `<div class="row" role="button" tabindex="0" onclick="editTx('${esc(x.id)}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();editTx('${esc(x.id)}')}"><span class="dot ${sale?'sale':w?'wage':'expense'}"></span><div class="rowmain"><div class="rowtitle">${esc(x.description||x.type||'Transaction')}</div><div class="rowsub">${esc(x.date||'')} ${x.funding?'· '+esc(x.funding):''} ${x.party?'· '+esc(x.party):''}</div></div><div class="amt ${sale?'plus':'minus'}">${sale?'+':'−'}${money(Number(x.amount)||0)}</div><button class="editIcon" type="button" aria-label="Edit transaction" onclick="event.stopPropagation();editTx('${esc(x.id)}')">Edit</button></div>`}
function historyRows(){let a=[...db.transactions].sort((x,y)=>(y.date+y.id).localeCompare(x.date+x.id));if(historyFilter!=='All')a=a.filter(x=>x.type===historyFilter);let q=(searchTerm||'').trim().toLowerCase();if(q)a=a.filter(x=>([x.date,x.type,x.description,x.category,x.funding,x.party,x.status].join(' ')).toLowerCase().includes(q));let groups={};a.forEach(x=>(groups[x.date]??=[]).push(x));return Object.keys(groups).length?Object.entries(groups).map(([d,items])=>`<div class="dayHead"><b>${new Date(d+'T00:00:00').toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'})}</b><span>${money(sum(items.filter(x=>x.type==='Sale')))} sales · ${money(sum(items.filter(x=>x.type!=='Sale')))} out</span></div><div class="card activity">${items.map(row).join('')}</div>`).join(''):'<div class="card emptyState">No transactions found</div>'}
function renderHistory(){document.getElementById('app').innerHTML=`<div class="viewTitle">Activity</div><div class="searchBox"><div class="search"><input id="histSearch" value="${esc(searchTerm)}" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Search description, supplier, category…"></div></div><div class="chips">${['All','Sale','Expense','Wage','Receivable','Receivable Recovery'].map(f=>`<button class="chip ${historyFilter===f?'on':''}" onclick="historyFilter='${f}';renderHistory()">${f==='Sale'?'Sales':f}</button>`).join('')}</div><div id="historyResults">${historyRows()}</div>`;let inp=document.getElementById('histSearch');if(inp){inp.addEventListener('input',e=>{searchTerm=e.target.value;updateHistoryResults()});if(searchTerm){inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length)}}}
function updateHistoryResults(){let el=document.getElementById('historyResults');if(el)el.innerHTML=historyRows()}
function renderMore(){let m=metrics();document.getElementById('app').innerHTML=`<div class="viewTitle">Control centre</div><div class="banner"><b>Owner view</b><br>${money(m.sales)} sales today · ${money(m.expenses+m.wages)} operating outflow. Daily entry stays simple; management lives here.</div><div class="moreGrid"><button class="moreItem" onclick="reports()"><b>Reports & Exports</b><span>Reports, Excel and JSON backup in one place</span></button><button class="moreItem" onclick="document.getElementById('restore').click()"><b>Restore</b><span>Load a previous JSON backup safely</span></button><button class="moreItem" onclick="inventory()"><b>Live Inventory</b><span>Opening, purchases, usage, adjustments & stock value</span></button><button class="moreItem" onclick="margins()"><b>Product Margins</b><span>Recipe cost, selling price and gross margin</span></button><button class="moreItem" onclick="owner()"><b>Owner Funding</b><span>Owner-paid expenses, cash introduced and withdrawals</span></button><button class="moreItem" onclick="supplier()"><b>Suppliers / Pending</b><span>Edit, partial pay, mark paid and track balances</span></button></div><input type="file" id="restore" accept="application/json" style="display:none" onchange="restore(this)">`}
function openSearch(){go('history');setTimeout(()=>document.getElementById('histSearch')?.focus(),50)}
function go(v){view=v;render()}
function openAdd(kind){let mode=kind==='cash'?'Cash Sale':kind==='upi'?'UPI Sale':kind==='expense'?'Expense':kind==='wage'?'Wage':kind==='receivable'?'Receivable':kind==='recovery'?'Receivable Recovery':null;document.getElementById('sheetContent').innerHTML=mode?formFor(mode):`<div class="sheetTitle">Quick add</div><div class="choiceGrid"><button class="choice" onclick="openAdd('cash')"><b>₹ Cash Sale</b><span>Physical cash received</span></button><button class="choice" onclick="openAdd('upi')"><b>⌁ UPI Sale</b><span>UPI / bank received</span></button><button class="choice" onclick="openAdd('expense')"><b>− Expense</b><span>Ingredients, utilities, etc.</span></button><button class="choice" onclick="openAdd('wage')"><b>○ Wage</b><span>Employee payment</span></button><button class="choice" onclick="formForExtra('Owner Funding')"><b>＋ Owner funding</b><span>Owner-paid or injected</span></button><button class="choice" onclick="formForExtra('Supplier Credit')"><b>◌ Supplier credit</b><span>Record unpaid purchase</span></button><button class="choice" onclick="openAdd('receivable')"><b>↗ Customer due</b><span>Record money to collect</span></button><button class="choice" onclick="openAdd('recovery')"><b>↙ Collect due</b><span>Record customer recovery</span></button></div>`;document.getElementById('sheet').classList.add('open')}
function refOptions(field,current=''){let vals=[...new Set(db.transactions.map(x=>x[field]).filter(Boolean))].slice(0,40);return vals.map(v=>`<option value="${esc(v)}" ${v===current?'selected':''}>${esc(v)}</option>`).join('')}
const EXP_CATS=['Ingredients','Stock / Purchases','Utilities','Rent','Repairs & Maintenance','Equipment','Packaging','Transport','Staff Food','Marketing','Setup','Bank / Charges','Other'];
const FUNDING=['Business Cash','Business Bank/UPI','Owner funded','Supplier Credit'];
function formFor(mode,tx={}){let sale=mode.includes('Sale'),w=mode==='Wage',ownerMode=mode==='Owner Funding',receivable=mode==='Receivable',recovery=mode==='Receivable Recovery';let cats=EXP_CATS.map(c=>`<option ${c===(tx.category||'Ingredients')?'selected':''}>${c}</option>`).join('');let funds=FUNDING.map(c=>`<option ${c===(tx.funding||'Business Cash')?'selected':''}>${c}</option>`).join('');let descs=[...new Set(db.transactions.filter(x=>x.type==='Expense').map(x=>x.description).filter(Boolean))].slice(-25).reverse();let employees=[...new Set(db.transactions.filter(x=>x.type==='Wage').map(x=>x.party).filter(Boolean))];let suppliers=[...new Set(db.transactions.map(x=>x.party).filter(Boolean))];return `<div class="sheetTitle">${tx.id?'Edit ':''}${mode}</div><div class="form"><div class="field"><label>Amount</label><input class="bigAmount" id="famt" type="number" inputmode="decimal" value="${tx.amount||''}" placeholder="₹ 0" autofocus></div>${sale?`<div class="field"><label>Channel</label><select disabled><option>${mode==='Cash Sale'?'Physical Cash':'UPI'}</option></select><div class="hint">Sales channels are fixed to Cash or UPI for clean reconciliation.</div></div>`:w?`<div class="field"><label>Employee</label><input id="fparty" list="employeeList" value="${esc(tx.party||'')}" placeholder="e.g. Naresh"><datalist id="employeeList">${employees.map(v=>`<option value="${esc(v)}">`).join('')}</datalist></div><div class="field"><label>Paid from</label><select id="ffund"><option>Business Cash</option><option>Business Bank/UPI</option></select></div>`:ownerMode?`<div class="field"><label>Owner transaction</label><select id="ownerType"><option>Owner paid expense</option><option>Cash introduced to café</option><option>Owner withdrawal / repayment</option></select></div><div class="field"><label>Purpose / note</label><input id="fdesc" value="${esc(tx.description||'')}" placeholder="e.g. Equipment paid personally"></div>`:receivable||recovery?`<div class="field"><label>Customer</label><input id="fparty" list="customerList" value="${esc(tx.party||'')}" placeholder="e.g. Regular customer"><datalist id="customerList">${suppliers.map(v=>`<option value="${esc(v)}">`).join('')}</datalist></div><div class="field"><label>Settlement channel</label><select id="ffund"><option>Business Cash</option><option>Business Bank/UPI</option></select></div>`:`<div class="field"><label>What was it?</label><input id="fdesc" list="expenseList" value="${esc(tx.description||'')}" placeholder="e.g. Milk, Vegetables, Gas"><datalist id="expenseList">${descs.map(v=>`<option value="${esc(v)}">`).join('')}</datalist><div class="hint">Start typing; past descriptions appear as suggestions.</div></div><div class="suggestions">${descs.slice(0,7).map(v=>`<button type="button" data-v="${esc(v)}" onclick="document.getElementById('fdesc').value=this.dataset.v">${esc(v)}</button>`).join('')}</div><div class="field"><label>Paid by</label><select id="ffund">${funds}</select></div><div class="field"><label>Category</label><select id="fcat">${cats}</select></div><div class="field"><label>Supplier / Payee</label><input id="fparty" list="supplierList" value="${esc(tx.party||'')}" placeholder="Optional — e.g. Metro Mart"><datalist id="supplierList">${suppliers.map(v=>`<option value="${esc(v)}">`).join('')}</datalist></div>`}<div class="field"><label>Date</label><input id="fdate" type="date" value="${tx.date||today()}"></div><button class="save" onclick="saveForm('${esc(mode)}','${esc(tx.id||'')}')">Save</button>${tx.id?`<button class="secondary danger" onclick="deleteTx('${esc(tx.id)}')">Delete transaction</button>`:''}<button class="secondary" onclick="closeSheet()">Cancel</button></div>`}
function formForExtra(mode){document.getElementById('sheetContent').innerHTML=formFor(mode);document.getElementById('sheet').classList.add('open')}
function saveForm(mode,id){let amount=Number(document.getElementById('famt').value);if(!amount)return alert('Enter an amount');let sale=mode.includes('Sale'),w=mode==='Wage',ownerMode=mode==='Owner Funding',receivable=mode==='Receivable',recovery=mode==='Receivable Recovery';let x=id?db.transactions.find(z=>z.id===id):null;if(!x){x={id:'tx-'+Date.now()};db.transactions.push(x)}x.date=document.getElementById('fdate').value;x.amount=amount;
 if(sale){x.type='Sale';x.description=mode==='Cash Sale'?'Sales through Physical Cash':'Sales through UPI';x.category=x.description;x.funding=mode==='Cash Sale'?'Business Cash':'Business Bank/UPI';x.status='Received';x.party=''}
 else if(w){x.type='Wage';x.description='Wage';x.category='Wages';x.funding=document.getElementById('ffund')?.value||'Business Cash';x.party=document.getElementById('fparty')?.value||'';x.status='Paid'}
 else if(receivable){x.type='Receivable';x.description='Customer due';x.category='Receivable';x.funding='Customer';x.party=document.getElementById('fparty')?.value||'';x.status='Open'}
 else if(recovery){x.type='Receivable Recovery';x.description='Customer recovery';x.category='Receivable Recovery';x.funding=document.getElementById('ffund')?.value||'Business Cash';x.party=document.getElementById('fparty')?.value||'';x.status='Received'}
 else if(ownerMode){let ot=document.getElementById('ownerType')?.value||'Owner paid expense';x.type=ot==='Owner paid expense'?'Expense':'Owner Funding';x.description=document.getElementById('fdesc')?.value||ot;x.category=ot;x.funding='Owner';x.party='Owner';x.status='Paid'}
 else {x.type='Expense';x.description=document.getElementById('fdesc')?.value||'Expense';x.category=document.getElementById('fcat')?.value||'Other';x.funding=document.getElementById('ffund')?.value||'Business Cash';x.party=document.getElementById('fparty')?.value||'';x.status=mode==='Supplier Credit'?'Pending':'Paid'}
 save();closeSheet();render()}
function closeSheet(){document.getElementById('sheet').classList.remove('open')}
function closeDay(){let m=metrics();document.getElementById('sheetContent').innerHTML=`<div class="sheetTitle">Close ${new Date().toLocaleDateString('en-IN',{day:'numeric',month:'short'})}</div><div class="card mini" style="margin-bottom:10px"><span>Cash sales</span><b>${money(m.cash)}</b><span>Cash expenses + wages</span><b>${money(expenses().filter(x=>x.date===today()&&/Cash/i.test(x.funding)).reduce((a,x)=>a+x.amount,0)+wages().filter(x=>x.date===today()&&/Cash/i.test(x.funding)).reduce((a,x)=>a+x.amount,0))}</b><span style="display:block;margin-top:8px">Expected closing cash depends on your opening cash.</span></div><div class="field"><label>Opening cash</label><input id="openCash" type="number" inputmode="decimal" placeholder="₹ 0"></div><div class="field"><label>Actual cash counted</label><input id="actualCash" type="number" inputmode="decimal" placeholder="₹ 0"></div><button class="save" onclick="finishClose()">Check & close</button><button class="secondary" onclick="closeSheet()">Cancel</button>`;document.getElementById('sheet').classList.add('open')}
function finishClose(){let m=metrics();let open=Number(document.getElementById('openCash').value||0),actual=Number(document.getElementById('actualCash').value||0);let cashOut=expenses().filter(x=>x.date===today()&&/Cash/i.test(x.funding)).reduce((a,x)=>a+x.amount,0)+wages().filter(x=>x.date===today()&&/Cash/i.test(x.funding)).reduce((a,x)=>a+x.amount,0);let expected=open+m.cash-cashOut;alert(`Expected cash: ${money(expected)}\nActual cash: ${money(actual)}\nDifference: ${money(actual-expected)}`);closeSheet()}
function reports(){let total=sum(sales()),exp=sum(expenses()),wag=sum(wages()),cash=sum(sales().filter(x=>/Physical Cash/i.test(x.description))),upi=sum(sales().filter(x=>/UPI/i.test(x.description))),ownerPaid=sum(expenses().filter(x=>/Owner funded/i.test(x.funding))),payable=payables().reduce((a,x)=>a+x.balance,0),recv=receivables().reduce((a,x)=>a+x.balance,0),stock=inventoryValue();document.getElementById('sheetContent').innerHTML=`<div class="sheetTitle">Reports & exports</div><div class="kpiGrid"><div class="kpi"><span>All-time sales</span><b>${money(total)}</b></div><div class="kpi"><span>Operating outflow</span><b>${money(exp+wag)}</b></div><div class="kpi"><span>Physical cash</span><b>${money(cash)}</b></div><div class="kpi"><span>UPI / bank</span><b>${money(upi)}</b></div><div class="kpi"><span>Supplier payable</span><b>${money(payable)}</b></div><div class="kpi"><span>Receivables</span><b>${money(recv)}</b></div><div class="kpi"><span>Owner-funded expenses</span><b>${money(ownerPaid)}</b></div><div class="kpi"><span>Inventory value</span><b>${money(stock)}</b></div></div><div class="sectionTitle">Downloads</div><div class="reportActions"><button onclick="exportXls()"><b>Export Excel</b><span>Transactions, daily ledger, inventory, margins, owner & suppliers</span></button><button onclick="backup()"><b>JSON backup</b><span>Full local database backup for restore</span></button></div><div class="sectionTitle">Accounting controls</div><div class="card mini"><div class="rowsub">Cash reconciliation, payables, receivables, owner funding and stock valuation are calculated from the same transaction ledger.</div></div><button class="secondary" onclick="closeSheet()">Done</button>`;document.getElementById('sheet').classList.add('open')}
function backup(){let payload={...db,exportedAt:new Date().toISOString(),appVersion:SEED_VERSION};let b=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='Hidden_Yard_JSON_Backup_'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function restore(inp){let f=inp.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x.transactions))throw 0;db=migrate(x);save();render();alert('Backup restored successfully')}catch(e){alert('Invalid or incompatible JSON backup')}};r.readAsText(f)}
function xmlCell(v){return `<Cell><Data ss:Type="String">${esc(v)}</Data></Cell>`}
function xmlSheet(name,headers,rows){let body=`<Row>${headers.map(xmlCell).join('')}</Row>`+rows.map(r=>`<Row>${r.map(xmlCell).join('')}</Row>`).join('');return `<Worksheet ss:Name="${esc(name).slice(0,31)}"><Table>${body}</Table></Worksheet>`}
function exportXls(){let txRows=db.transactions.map(x=>[x.date,x.type,x.description,x.amount,x.category,x.funding,x.party||'',x.status]);let daily={};db.transactions.forEach(x=>{let d=daily[x.date] ||= {cash:0,upi:0,sales:0,exp:0,wage:0};if(x.type==='Sale'){d.sales+=x.amount;if(/Physical Cash/i.test(x.description))d.cash+=x.amount;else d.upi+=x.amount}else if(x.type==='Wage')d.wage+=x.amount;else if(x.type==='Expense')d.exp+=x.amount});let dRows=Object.entries(daily).sort().map(([d,v])=>[d,v.cash,v.upi,v.sales,v.exp,v.wage,v.sales-v.exp-v.wage]);let invRows=inventoryItems().map(x=>[x.name,x.category,x.unit,x.opening,x.purchased,x.used,x.adjusted,x.current,x.avgCost,Math.round(x.current*x.avgCost),x.reorder,x.current<=x.reorder?'REORDER':'OK']);let prodRows=db.products.map(x=>{let c=productCost(x);return [x.Product||x.name,x.Category||x.category||'',x['Selling Price']||x.price||0,c.ingredient+c.packaging+c.other,c.gross,c.margin]});let ownerRows=ownerTransactions().map(x=>[x.date,x.type,x.description,x.amount,x.party||'',x.status]);let supRows=payables().map(x=>[x.party||'Supplier',x.description,x.date,x.original,x.paid,x.balance,x.status]);let recRows=receivables().map(x=>[x.party||'Customer',x.description,x.date,x.original,x.paid,x.balance,x.status]);let wb=`<?xml version="1.0"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet"><Styles><Style ss:ID="Default"><Alignment ss:Vertical="Center"/></Style></Styles>${xmlSheet('Transactions',['Date','Type','Description','Amount','Category','Funding','Party / Supplier','Status'],txRows)}${xmlSheet('Daily Ledger',['Date','Cash Sales','UPI Sales','Total Sales','Expenses','Wages','Net'],dRows)}${xmlSheet('Inventory',['Item','Category','Unit','Opening','Purchased','Used','Adjusted','Current Qty','Avg Cost','Stock Value','Reorder','Status'],invRows)}${xmlSheet('Product Margins',['Product','Category','Selling Price','Total Cost','Gross Profit','Margin'],prodRows)}${xmlSheet('Owner Funding',['Date','Type','Description','Amount','Party','Status'],ownerRows)}${xmlSheet('Suppliers',['Supplier','Description','Date','Original','Paid','Balance','Status'],supRows)}${xmlSheet('Receivables',['Customer','Description','Date','Original','Recovered','Balance','Status'],recRows)}</Workbook>`;let blob=new Blob([wb],{type:'application/vnd.ms-excel'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Hidden_Yard_Accounts_'+today()+'.xls';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function inventoryItems(){if(!db.inventoryItems)db.inventoryItems=[];return db.inventoryItems.map(x=>{let moves=(db.inventoryMoves||[]).filter(m=>m.itemId===x.id);let purchased=moves.filter(m=>m.kind==='purchase').reduce((a,m)=>a+Number(m.qty||0),0);let used=moves.filter(m=>m.kind==='usage').reduce((a,m)=>a+Number(m.qty||0),0);let adjusted=moves.filter(m=>m.kind==='adjustment').reduce((a,m)=>a+Number(m.qty||0),0);let current=Number(x.opening||x['Opening Qty']||0)+purchased-used+adjusted;let cost=Number(x.avgCost??x['Avg Cost / Unit']??0);return {...x,name:x.name||x.Item,category:x.category||x.Category||'Ingredients',unit:x.unit||x.Unit||'Unit',opening:Number(x.opening??x['Opening Qty']??0),purchased,used,adjusted,current,avgCost:cost,reorder:Number(x.reorder??x['Reorder Level']??0)}})}
function inventoryValue(){return inventoryItems().reduce((a,x)=>a+x.current*x.avgCost,0)}
function inventory(){let items=inventoryItems();document.getElementById('sheetContent').innerHTML=`<div class="sheetTitle">Live inventory</div><div class="kpiGrid"><div class="kpi"><span>Items</span><b>${items.length}</b></div><div class="kpi"><span>Stock value</span><b>${money(inventoryValue())}</b></div></div><div class="listAction" style="margin:10px 0"><button class="smallBtn primary" onclick="inventoryForm('new')">＋ New item</button><button class="smallBtn" onclick="inventoryMoveForm('purchase')">＋ Purchase</button><button class="smallBtn" onclick="inventoryMoveForm('usage')">− Usage</button><button class="smallBtn" onclick="inventoryMoveForm('adjustment')">↕ Adjust</button></div><div class="card activity">${items.map(x=>`<div class="row" onclick="inventoryForm('${esc(x.id)}')"><div class="rowmain"><div class="rowtitle">${esc(x.name)}</div><div class="rowsub">${esc(x.category)} · ${esc(x.unit)} · ${x.avgCost?money(x.avgCost)+' / '+esc(x.unit):'Cost not set'}</div></div><div style="text-align:right"><div class="amt">${x.current}</div><div class="subtle">${x.current<=x.reorder?'Reorder':'in stock'}</div></div></div>`).join('')}</div><button class="secondary" onclick="closeSheet()">Done</button>`;document.getElementById('sheet').classList.add('open')}
function inventoryForm(id){let x=id==='new'?{id:'',name:'',category:'Ingredients',unit:'Kg',opening:0,avgCost:0,reorder:0}:inventoryItems().find(z=>z.id===id);if(!x)return;document.getElementById('sheetContent').innerHTML=`<div class="sheetTitle">${id==='new'?'New inventory item':'Edit inventory item'}</div><div class="form"><div class="field"><label>Item name</label><input id="invName" value="${esc(x.name)}" placeholder="e.g. Milk"></div><div class="field"><label>Category</label><select id="invCat">${['Ingredients','Beverages','Packaging','Cleaning','Other'].map(c=>`<option ${c===x.category?'selected':''}>${c}</option>`).join('')}</select></div><div class="field"><label>Unit</label><select id="invUnit">${['Kg','Litre','Packet','Piece','Box','Bottle','Gram','ML','Other'].map(c=>`<option ${c===x.unit?'selected':''}>${c}</option>`).join('')}</select></div><div class="field"><label>Opening quantity</label><input id="invOpening" type="number" value="${x.opening}" placeholder="e.g. 10"></div><div class="field"><label>Average cost / unit</label><input id="invCost" type="number" value="${x.avgCost}" placeholder="e.g. ₹60"></div><div class="field"><label>Reorder level</label><input id="invReorder" type="number" value="${x.reorder}" placeholder="e.g. 2"></div><button class="save" onclick="saveInventory('${esc(id)}')">Save item</button><button class="secondary" onclick="inventory()">Back</button></div>`}
function saveInventory(id){let name=document.getElementById('invName').value.trim();if(!name)return alert('Enter item name');if(id==='new'){db.inventoryItems.push({id:'inv-'+Date.now(),name,category:document.getElementById('invCat').value,unit:document.getElementById('invUnit').value,opening:Number(document.getElementById('invOpening').value||0),avgCost:Number(document.getElementById('invCost').value||0),reorder:Number(document.getElementById('invReorder').value||0)})}else{let x=db.inventoryItems.find(z=>z.id===id);Object.assign(x,{name,category:document.getElementById('invCat').value,unit:document.getElementById('invUnit').value,opening:Number(document.getElementById('invOpening').value||0),avgCost:Number(document.getElementById('invCost').value||0),reorder:Number(document.getElementById('invReorder').value||0)})}save();inventory()}
function inventoryMoveForm(kind){let items=inventoryItems();document.getElementById('sheetContent').innerHTML=`<div class="sheetTitle">${kind==='purchase'?'Record purchase':kind==='usage'?'Record usage':'Stock adjustment'}</div><div class="form"><div class="field"><label>Item</label><select id="mvItem">${items.map(x=>`<option value="${esc(x.id)}">${esc(x.name)} · ${esc(x.unit)}</option>`).join('')}</select></div><div class="field"><label>Quantity</label><input id="mvQty" type="number" inputmode="decimal" placeholder="e.g. 5"></div>${kind==='purchase'?`<div class="field"><label>Total purchase amount</label><input id="mvAmt" type="number" inputmode="decimal" placeholder="e.g. ₹300"><div class="hint">Used to update average cost and can optionally create an expense.</div></div><div class="field"><label>Paid by</label><select id="mvFund"><option>Business Cash</option><option>Business Bank/UPI</option><option>Owner funded</option><option>Supplier Credit</option></select></div>`:kind==='adjustment'?`<div class="field"><label>Adjustment</label><select id="mvSign"><option value="1">Increase stock</option><option value="-1">Decrease stock</option></select></div>`:''}<div class="field"><label>Date</label><input id="mvDate" type="date" value="${today()}"></div><button class="save" onclick="saveInventoryMove('${kind}')">Save</button><button class="secondary" onclick="inventory()">Cancel</button></div>`}
function saveInventoryMove(kind){let item=db.inventoryItems.find(x=>x.id===document.getElementById('mvItem').value),qty=Number(document.getElementById('mvQty').value||0);if(!item||qty<=0)return alert('Select an item and enter a valid quantity');let move={id:'mv-'+Date.now(),itemId:item.id,kind,qty:kind==='adjustment'?qty*Number(document.getElementById('mvSign').value):qty,date:document.getElementById('mvDate').value};db.inventoryMoves.push(move);if(kind==='purchase'){let amt=Number(document.getElementById('mvAmt').value||0);if(amt){let oldQty=inventoryItems().find(x=>x.id===item.id).current;let oldCost=Number(item.avgCost||0);item.avgCost=(oldQty*oldCost+amt)/(oldQty+qty);db.transactions.push({id:'tx-'+Date.now()+'-inv',date:move.date,type:'Expense',description:'Inventory purchase — '+item.name,amount:amt,category:'Stock / Purchases',funding:document.getElementById('mvFund').value,party:'',status:document.getElementById('mvFund').value==='Supplier Credit'?'Pending':'Paid'})}}save();inventory()}
function productCost(p){let ingredients=Array.isArray(p.ingredients)?p.ingredients:[];let ingredient=ingredients.reduce((a,i)=>{let it=inventoryItems().find(x=>x.id===i.itemId||x.name===i.item);return a+Number(i.qty||0)*Number(it?.avgCost||0)},0);let packaging=Number(p.packaging||p['Packaging Cost']||0),other=Number(p.other||0),price=Number(p.price||p['Selling Price']||0),gross=price-ingredient-packaging-other;return {ingredient,packaging,other,gross,margin:price?gross/price:0}}
function margins(){let products=db.products||[];document.getElementById('sheetContent').innerHTML=`<div class="sheetTitle">Product margins</div><div class="kpiGrid"><div class="kpi"><span>Products</span><b>${products.length}</b></div><div class="kpi"><span>With pricing</span><b>${products.filter(p=>Number(p.price||p['Selling Price'])).length}</b></div></div><div class="listAction" style="margin:10px 0"><button class="smallBtn primary" onclick="productForm('new')">＋ New product</button></div><div class="card activity">${products.map((p,i)=>{let c=productCost(p);return `<div class="row" onclick="productForm('${esc(p.id||'p-'+i)}')"><div class="rowmain"><div class="rowtitle">${esc(p.Product||p.name||'Unnamed product')}</div><div class="rowsub">Selling ${money(p.price||p['Selling Price']||0)} · Cost ${money(c.ingredient+c.packaging+c.other)}</div></div><div style="text-align:right"><div class="amt ${c.margin>=.5?'plus':c.margin>0?'':'minus'}">${Math.round(c.margin*100)}%</div><div class="subtle">gross margin</div></div></div>`}).join('')}</div><button class="secondary" onclick="closeSheet()">Done</button>`;document.getElementById('sheet').classList.add('open')}
function productForm(id){let p=id==='new'?{id:'',Product:'',Category:'Menu',price:0,packaging:0,other:0,ingredients:[]}:db.products.find((z,i)=>z.id===id||(!z.id&&'p-'+i===id));if(!p)return;let items=inventoryItems();let rows=(p.ingredients||[]).map((i,n)=>`<div class="inlineForm" id="ing${n}"><div><select class="ingItem">${items.map(x=>`<option value="${esc(x.id)}" ${x.id===i.itemId?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div><input class="ingQty" type="number" value="${i.qty||0}" placeholder="Qty / recipe"></div></div>`).join('');document.getElementById('sheetContent').innerHTML=`<div class="sheetTitle">${id==='new'?'New product':'Edit product'}</div><div class="form"><div class="field"><label>Product name</label><input id="pName" value="${esc(p.Product||p.name||'')}" placeholder="e.g. Ginger Tea"></div><div class="field"><label>Category</label><input id="pCat" value="${esc(p.Category||p.category||'')}" placeholder="Tea / Breakfast / Snacks"></div><div class="field"><label>Selling price</label><input id="pPrice" type="number" value="${p.price||p['Selling Price']||0}" placeholder="₹ 0"></div><div class="field"><label>Packaging cost</label><input id="pPack" type="number" value="${p.packaging||0}" placeholder="₹ 0"></div><div class="field"><label>Other direct cost</label><input id="pOther" type="number" value="${p.other||0}" placeholder="₹ 0"></div><div class="sectionTitle">Recipe / ingredient usage</div><div id="ingredients">${rows}</div><button class="smallBtn" type="button" onclick="addIngredientRow()">＋ Add ingredient</button><div id="productCalc" class="calcBox" style="margin-top:10px">Save to calculate recipe cost and margin.</div><button class="save" onclick="saveProduct('${esc(id)}')">Save product</button><button class="secondary" onclick="margins()">Back</button></div>`;['pPrice','pPack','pOther'].forEach(id=>document.getElementById(id).addEventListener('input',previewProductCost));previewProductCost()}
function addIngredientRow(){let box=document.getElementById('ingredients'),n=box.children.length,items=inventoryItems();box.insertAdjacentHTML('beforeend',`<div class="inlineForm" id="ing${n}"><div><select class="ingItem">${items.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('')}</select></div><div><input class="ingQty" type="number" value="0" placeholder="Qty / recipe"></div></div>`);document.querySelectorAll('.ingQty,.ingItem').forEach(e=>e.addEventListener('input',previewProductCost))}
function collectIngredients(){return [...document.querySelectorAll('#ingredients .inlineForm')].map(r=>({itemId:r.querySelector('.ingItem').value,qty:Number(r.querySelector('.ingQty').value||0)})).filter(x=>x.qty>0)}
function previewProductCost(){let p={price:Number(document.getElementById('pPrice')?.value||0),packaging:Number(document.getElementById('pPack')?.value||0),other:Number(document.getElementById('pOther')?.value||0),ingredients:collectIngredients()};let c=productCost(p);let el=document.getElementById('productCalc');if(el)el.innerHTML=`<span class="subtle">Ingredient cost</span><br>${money(c.ingredient)}<br><span class="subtle">Total direct cost</span><br><b>${money(c.ingredient+c.packaging+c.other)}</b><br><span class="subtle">Gross profit / margin</span><br><b>${money(c.gross)} · ${Math.round(c.margin*100)}%</b>`}
function saveProduct(id){let p=id==='new'?{id:'p-'+Date.now()}:db.products.find((z,i)=>z.id===id||(!z.id&&'p-'+i===id));if(!p)return;Object.assign(p,{Product:document.getElementById('pName').value.trim(),Category:document.getElementById('pCat').value.trim(),price:Number(document.getElementById('pPrice').value||0),packaging:Number(document.getElementById('pPack').value||0),other:Number(document.getElementById('pOther').value||0),ingredients:collectIngredients()});if(!p.Product)return alert('Enter product name');if(id==='new')db.products.push(p);save();margins()}
function ownerTransactions(){return db.transactions.filter(x=>x.type==='Owner Funding'||/Owner funded/i.test(x.funding))}
function owner(){let a=ownerTransactions(),paid=a.filter(x=>/Owner funded/i.test(x.funding)||x.category==='Owner paid expense').reduce((s,x)=>s+x.amount,0),injected=a.filter(x=>x.type==='Owner Funding'&&/introduced|received/i.test(x.category+' '+x.description)).reduce((s,x)=>s+x.amount,0),withdrawn=a.filter(x=>x.type==='Owner Funding'&&/withdrawal|repayment/i.test(x.category+' '+x.description)).reduce((s,x)=>s+x.amount,0);document.getElementById('sheetContent').innerHTML=`<div class="sheetTitle">Owner funding</div><div class="kpiGrid"><div class="kpi"><span>Owner-paid expenses</span><b>${money(paid)}</b></div><div class="kpi"><span>Cash introduced</span><b>${money(injected)}</b></div><div class="kpi"><span>Withdrawn / repaid</span><b>${money(withdrawn)}</b></div><div class="kpi"><span>Net owner contribution</span><b>${money(paid+injected-withdrawn)}</b></div></div><div class="listAction" style="margin:10px 0"><button class="smallBtn primary" onclick="formForExtra('Owner Funding')">＋ Owner entry</button></div><div class="card activity">${a.slice().sort((x,y)=>(y.date+y.id).localeCompare(x.date+x.id)).map(row).join('')||'<div class="emptyState">No owner funding entries.</div>'}</div><button class="secondary" onclick="closeSheet()">Done</button>`;document.getElementById('sheet').classList.add('open')}
function payables(){let credits=db.transactions.filter(x=>x.type==='Expense'&&/Supplier Credit/i.test(x.funding));return credits.map(x=>{let paid=db.transactions.filter(p=>p.type==='Supplier Payment'&&p.referenceId===x.id).reduce((s,p)=>s+p.amount,0);return {...x,original:x.amount,paid,balance:Math.max(0,x.amount-paid),status:paid>=x.amount?'Paid':paid>0?'Part Paid':'Pending'}}).filter(x=>x.balance>0)}
function supplier(){let a=payables();document.getElementById('sheetContent').innerHTML=`<div class="sheetTitle">Suppliers / pending</div><div class="kpiGrid"><div class="kpi"><span>Outstanding</span><b>${money(a.reduce((s,x)=>s+x.balance,0))}</b></div><div class="kpi"><span>Open bills</span><b>${a.length}</b></div></div><div class="card activity">${a.map(x=>`<div class="row"><div class="rowmain"><div class="rowtitle">${esc(x.party||'Supplier')} · ${esc(x.description)}</div><div class="rowsub">${x.date} · Original ${money(x.original)} · Paid ${money(x.paid)}</div></div><div style="text-align:right"><div class="amt minus">${money(x.balance)}</div><div class="listAction"><button class="smallBtn" onclick="editTx('${esc(x.id)}')">Edit</button><button class="smallBtn primary" onclick="supplierPay('${esc(x.id)}')">Pay</button></div></div></div>`).join('')||'<div class="emptyState">No pending supplier bills.</div>'}</div><button class="secondary" onclick="closeSheet()">Done</button>`;document.getElementById('sheet').classList.add('open')}
function supplierPay(id){let x=db.transactions.find(z=>z.id===id);if(!x)return;document.getElementById('sheetContent').innerHTML=`<div class="sheetTitle">Pay supplier</div><div class="calcBox">Outstanding <b>${money(payables().find(z=>z.id===id)?.balance||0)}</b></div><div class="form"><div class="field"><label>Payment amount</label><input id="spAmt" type="number" value="${payables().find(z=>z.id===id)?.balance||0}" placeholder="₹ 0"></div><div class="field"><label>Paid by</label><select id="spFund"><option>Business Cash</option><option>Business Bank/UPI</option><option>Owner funded</option></select></div><button class="save" onclick="saveSupplierPayment('${esc(id)}')">Record payment</button><button class="secondary" onclick="supplier()">Cancel</button></div>`}
function saveSupplierPayment(id){let p=payables().find(z=>z.id===id),amt=Number(document.getElementById('spAmt').value||0);if(!p||amt<=0||amt>p.balance)return alert('Enter an amount up to the outstanding balance');db.transactions.push({id:'tx-'+Date.now(),date:today(),type:'Supplier Payment',description:'Payment to '+(p.party||'Supplier'),amount:amt,category:'Payable Settlement',funding:document.getElementById('spFund').value,party:p.party||'',status:'Paid',referenceId:id});save();supplier()}
function receivables(){let credits=db.transactions.filter(x=>x.type==='Receivable');return credits.map(x=>{let paid=db.transactions.filter(p=>p.type==='Receivable Recovery'&&p.referenceId===x.id).reduce((s,p)=>s+p.amount,0);return {...x,original:x.amount,paid,balance:Math.max(0,x.amount-paid),status:paid>=x.amount?'Recovered':paid>0?'Part Recovered':'Open'}}).filter(x=>x.balance>0)}

/* V8 navigation + editing layer */
let sheetBackFn=()=>closeSheet();
function ensureSheetToolbar(){
  const box=document.querySelector('.sheetBox'); if(!box)return;
  let tb=box.querySelector('.sheetToolbar');
  if(!tb){tb=document.createElement('div');tb.className='sheetToolbar';tb.innerHTML='<button id="sheetBackBtn" type="button">‹ Back</button><button id="sheetCloseBtn" class="closeBtn" type="button" aria-label="Close">×</button>';box.insertBefore(tb,document.getElementById('sheetContent'));}
  document.getElementById('sheetBackBtn').onclick=()=>{try{sheetBackFn()}catch(e){closeSheet()}};
  document.getElementById('sheetCloseBtn').onclick=()=>closeSheet();
}
function openSheet(){ensureSheetToolbar();document.getElementById('sheet').classList.add('open');}
function setSheetBack(fn){sheetBackFn=fn||(()=>closeSheet());ensureSheetToolbar();}
function closeSheet(){document.getElementById('sheet').classList.remove('open');sheetBackFn=()=>closeSheet();}
function editTx(id){
  const x=db.transactions.find(z=>String(z.id)===String(id));
  if(!x){alert('Transaction could not be found.');return;}
  // Legacy-safe normalization: older exports may have missing/variant fields.
  x.id=x.id||('tx-'+Date.now());
  x.date=x.date||today();
  x.type=x.type||'Expense';
  x.description=x.description||'';
  x.amount=Number(x.amount)||0;
  x.category=x.category||'Other';
  x.funding=x.funding||'Business Cash';
  x.party=x.party||'';
  x.status=x.status||'Paid';
  let mode='Expense';
  if(x.type==='Sale') mode=/upi|bank/i.test(String(x.description)+' '+String(x.funding))?'UPI Sale':'Cash Sale';
  else if(x.type==='Wage') mode='Wage';
  else if(x.type==='Receivable') mode='Receivable';
  else if(x.type==='Receivable Recovery') mode='Receivable Recovery';
  else if(x.type==='Supplier Payment') return settlementEdit(x,'Supplier Payment');
  else if(x.type==='Owner Funding' || /owner funded/i.test(x.funding) && /owner/i.test(x.category+' '+x.description)) mode='Owner Funding';
  document.getElementById('sheetContent').innerHTML=formFor(mode,x);
  openSheet();
  setSheetBack(()=>closeSheet());
  // Make the edit state unmistakable and keep the save action visible.
  const title=document.querySelector('#sheetContent .sheetTitle');
  if(title) title.textContent='Edit transaction';
  const saveBtn=document.querySelector('#sheetContent button.save');
  if(saveBtn) saveBtn.textContent='Save changes';
  const cancelBtn=document.querySelector('#sheetContent button.secondary:not(.danger)');
  if(cancelBtn) cancelBtn.textContent='Cancel';
  document.getElementById('famt')?.focus();
}
function deleteTx(id){const x=db.transactions.find(z=>z.id===id);if(!x)return;if(confirm('Delete this transaction? This cannot be undone.')){db.transactions=db.transactions.filter(z=>z.id!==id);save();closeSheet();render()}}
function settlementEdit(x,type){document.getElementById('sheetContent').innerHTML=`<div class="sheetTitle">Edit ${type==='Supplier Payment'?'supplier payment':'settlement'}</div><div class="form"><div class="field"><label>Amount</label><input id="seAmt" class="bigAmount" type="number" value="${x.amount||0}" placeholder="e.g. 1000"></div><div class="field"><label>Paid by</label><select id="seFund"><option ${x.funding==='Business Cash'?'selected':''}>Business Cash</option><option ${x.funding==='Business Bank/UPI'?'selected':''}>Business Bank/UPI</option><option ${x.funding==='Owner funded'?'selected':''}>Owner funded</option></select></div><div class="field"><label>Date</label><input id="seDate" type="date" value="${x.date||today()}"></div><button class="save" onclick="saveSettlementEdit('${esc(x.id)}')">Save changes</button><button class="secondary danger" onclick="deleteTx('${esc(x.id)}')">Delete</button></div>`;openSheet();setSheetBack(()=>closeSheet())}
function saveSettlementEdit(id){let x=db.transactions.find(z=>z.id===id);if(!x)return;x.amount=Number(document.getElementById('seAmt').value||0);x.funding=document.getElementById('seFund').value;x.date=document.getElementById('seDate').value;if(x.amount<=0)return alert('Enter a valid amount');save();closeSheet();render()}

function inventoryMoveForm(kind){let items=inventoryItems();document.getElementById('sheetContent').innerHTML=`<div class="sheetTitle">${kind==='purchase'?'Record purchase':kind==='usage'?'Record usage':'Stock adjustment'}</div><div class="form"><div class="field"><label>Item</label><select id="mvItem">${items.map(x=>`<option value="${esc(x.id)}">${esc(x.name)} · ${esc(x.unit)} · ${x.current} available</option>`).join('')}</select></div><div class="field"><label>Quantity</label><input id="mvQty" type="number" inputmode="decimal" placeholder="e.g. 5"></div>${kind==='purchase'?`<div class="field"><label>Total purchase amount</label><input id="mvAmt" type="number" inputmode="decimal" placeholder="e.g. ₹300"></div><div class="field"><label>Paid by</label><select id="mvFund"><option>Business Cash</option><option>Business Bank/UPI</option><option>Owner funded</option><option>Supplier Credit</option></select></div>`:kind==='adjustment'?`<div class="field"><label>Adjustment</label><select id="mvSign"><option value="1">Increase stock</option><option value="-1">Decrease stock</option></select></div>`:''}<div class="field"><label>Date</label><input id="mvDate" type="date" value="${today()}"></div><button class="save" onclick="saveInventoryMove('${kind}')">Save</button><button class="secondary" onclick="inventory()">‹ Back to inventory</button></div>`;openSheet();setSheetBack(()=>inventory())}
function margins(){let products=db.products||[];document.getElementById('sheetContent').innerHTML=`<div class="sheetTitle">Product margins</div><div class="kpiGrid"><div class="kpi"><span>Products</span><b>${products.length}</b></div><div class="kpi"><span>Priced</span><b>${products.filter(p=>Number(p.price||p['Selling Price'])).length}</b></div></div><div class="listAction" style="margin:10px 0"><button class="smallBtn primary" onclick="productForm('new')">＋ New product</button></div><div class="card activity">${products.map((p,i)=>{let c=productCost(p);return `<div class="row" onclick="productForm('${esc(p.id||'p-'+i)}')"><div class="rowmain"><div class="rowtitle">${esc(p.Product||p.name||'Unnamed product')}</div><div class="rowsub">Selling ${money(p.price||p['Selling Price']||0)} · Cost ${money(c.ingredient+c.packaging+c.other)}</div></div><div style="text-align:right"><div class="amt ${c.margin>0?'plus':'minus'}">${Math.round(c.margin*100)}%</div><div class="subtle">margin</div></div></div>`}).join('')||'<div class="emptyState">No products yet.</div>'}</div>`;openSheet();setSheetBack(()=>closeSheet())}
function productForm(id){let p=id==='new'?{id:'',Product:'',Category:'Menu',price:0,packaging:0,other:0,ingredients:[]}:db.products.find((z,i)=>z.id===id||(!z.id&&'p-'+i===id));if(!p)return;let items=inventoryItems();let rows=(p.ingredients||[]).map((i,n)=>`<div class="inlineForm" id="ing${n}"><select class="ingItem">${items.map(x=>`<option value="${esc(x.id)}" ${x.id===i.itemId?'selected':''}>${esc(x.name)}</option>`).join('')}</select><input class="ingQty" type="number" value="${i.qty||0}" placeholder="Qty / recipe"></div>`).join('');document.getElementById('sheetContent').innerHTML=`<div class="sheetTitle">${id==='new'?'New product':'Edit product'}</div><div class="form"><div class="field"><label>Product name</label><input id="pName" value="${esc(p.Product||p.name||'')}" placeholder="e.g. Ginger Tea"></div><div class="field"><label>Category</label><input id="pCat" value="${esc(p.Category||p.category||'')}" placeholder="Tea / Breakfast / Snacks"></div><div class="field"><label>Selling price</label><input id="pPrice" type="number" value="${p.price||p['Selling Price']||0}" placeholder="₹ 40"></div><div class="field"><label>Packaging cost</label><input id="pPack" type="number" value="${p.packaging||0}" placeholder="₹ 2"></div><div class="field"><label>Other direct cost</label><input id="pOther" type="number" value="${p.other||0}" placeholder="₹ 1"></div><div class="sectionTitle">Recipe</div><div id="ingredients">${rows}</div><button class="smallBtn" type="button" onclick="addIngredientRow()">＋ Add ingredient</button><div id="productCalc" class="calcBox" style="margin-top:10px">Add recipe quantities to calculate margin.</div><button class="save" onclick="saveProduct('${esc(id)}')">Save product</button>${id!=='new'?`<button class="secondary danger" onclick="deleteProduct('${esc(id)}')">Delete product</button>`:''}<button class="secondary" onclick="margins()">‹ Back to products</button></div>`;['pPrice','pPack','pOther'].forEach(id=>document.getElementById(id)?.addEventListener('input',previewProductCost));document.querySelectorAll('.ingQty,.ingItem').forEach(e=>e.addEventListener('input',previewProductCost));previewProductCost();openSheet();setSheetBack(()=>margins())}
function deleteProduct(id){if(!confirm('Delete this product?'))return;db.products=db.products.filter((p,i)=>p.id!==id&&'p-'+i!==id);save();margins()}
function owner(){let a=ownerTransactions(),paid=a.filter(x=>/Owner funded/i.test(x.funding)||x.category==='Owner paid expense').reduce((s,x)=>s+x.amount,0),injected=a.filter(x=>x.type==='Owner Funding'&&/introduced|received/i.test(x.category+' '+x.description)).reduce((s,x)=>s+x.amount,0),withdrawn=a.filter(x=>x.type==='Owner Funding'&&/withdrawal|repayment/i.test(x.category+' '+x.description)).reduce((s,x)=>s+x.amount,0);document.getElementById('sheetContent').innerHTML=`<div class="sheetTitle">Owner funding</div><div class="kpiGrid"><div class="kpi"><span>Owner-paid expenses</span><b>${money(paid)}</b></div><div class="kpi"><span>Cash introduced</span><b>${money(injected)}</b></div><div class="kpi"><span>Withdrawn / repaid</span><b>${money(withdrawn)}</b></div><div class="kpi"><span>Net contribution</span><b>${money(paid+injected-withdrawn)}</b></div></div><div class="listAction" style="margin:10px 0"><button class="smallBtn primary" onclick="formForExtra('Owner Funding')">＋ Owner entry</button></div><div class="card activity">${a.slice().sort((x,y)=>(y.date+y.id).localeCompare(x.date+x.id)).map(row).join('')||'<div class="emptyState">No owner entries.</div>'}</div>`;openSheet();setSheetBack(()=>closeSheet())}
function supplier(){let a=payables();document.getElementById('sheetContent').innerHTML=`<div class="sheetTitle">Suppliers / pending</div><div class="kpiGrid"><div class="kpi"><span>Outstanding</span><b>${money(a.reduce((s,x)=>s+x.balance,0))}</b></div><div class="kpi"><span>Open bills</span><b>${a.length}</b></div></div><div class="card activity">${a.map(x=>`<div class="row"><div class="rowmain"><div class="rowtitle">${esc(x.party||'Supplier')} · ${esc(x.description)}</div><div class="rowsub">${x.date} · Original ${money(x.original)} · Paid ${money(x.paid)}</div></div><div style="text-align:right"><div class="amt minus">${money(x.balance)}</div><div class="listAction"><button class="smallBtn" onclick="editTx('${esc(x.id)}')">Edit</button><button class="smallBtn primary" onclick="supplierPay('${esc(x.id)}')">Pay</button></div></div></div>`).join('')||'<div class="emptyState">No pending supplier bills.</div>'}</div>`;openSheet();setSheetBack(()=>closeSheet())}
function supplierPay(id){let p=payables().find(z=>z.id===id);if(!p)return;document.getElementById('sheetContent').innerHTML=`<div class="sheetTitle">Pay supplier</div><div class="calcBox">Outstanding <b>${money(p.balance)}</b></div><div class="form"><div class="field"><label>Payment amount</label><input id="spAmt" type="number" value="${p.balance}" placeholder="e.g. 1000"></div><div class="field"><label>Paid by</label><select id="spFund"><option>Business Cash</option><option>Business Bank/UPI</option><option>Owner funded</option></select></div><div class="field"><label>Date</label><input id="spDate" type="date" value="${today()}"></div><button class="save" onclick="saveSupplierPayment('${esc(id)}')">Record payment</button><button class="secondary" onclick="supplier()">‹ Back to suppliers</button></div>`;openSheet();setSheetBack(()=>supplier())}
function closeDay(){let m=metrics();document.getElementById('sheetContent').innerHTML=`<div class="sheetTitle">Close day</div><div class="card mini" style="margin-bottom:10px"><span>Cash sales</span><b>${money(m.cash)}</b><span>Cash expenses + wages</span><b>${money(expenses().filter(x=>x.date===today()&&/Cash/i.test(x.funding)).reduce((a,x)=>a+x.amount,0)+wages().filter(x=>x.date===today()&&/Cash/i.test(x.funding)).reduce((a,x)=>a+x.amount,0))}</b></div><div class="form"><div class="field"><label>Opening cash</label><input id="openCash" type="number" inputmode="decimal" placeholder="e.g. ₹5,000"></div><div class="field"><label>Actual cash counted</label><input id="actualCash" type="number" inputmode="decimal" placeholder="e.g. ₹6,080"></div><button class="save" onclick="finishClose()">Check & close</button></div>`;openSheet();setSheetBack(()=>closeSheet())}
function reports(){let total=sum(sales()),exp=sum(expenses()),wag=sum(wages()),cash=sum(sales().filter(x=>/Physical Cash/i.test(x.description))),upi=sum(sales().filter(x=>/UPI/i.test(x.description))),ownerPaid=sum(expenses().filter(x=>/Owner funded/i.test(x.funding))),payable=payables().reduce((a,x)=>a+x.balance,0),recv=receivables().reduce((a,x)=>a+x.balance,0),stock=inventoryValue();document.getElementById('sheetContent').innerHTML=`<div class="sheetTitle">Reports & exports</div><div class="kpiGrid"><div class="kpi"><span>All-time sales</span><b>${money(total)}</b></div><div class="kpi"><span>Operating outflow</span><b>${money(exp+wag)}</b></div><div class="kpi"><span>Cash sales</span><b>${money(cash)}</b></div><div class="kpi"><span>UPI sales</span><b>${money(upi)}</b></div><div class="kpi"><span>Supplier payable</span><b>${money(payable)}</b></div><div class="kpi"><span>Receivables</span><b>${money(recv)}</b></div><div class="kpi"><span>Owner-funded</span><b>${money(ownerPaid)}</b></div><div class="kpi"><span>Inventory value</span><b>${money(stock)}</b></div></div><div class="sectionTitle">Export & backup</div><div class="reportActions"><button onclick="exportXls()"><b>Excel report</b><span>Ledger, inventory, margins, owner & suppliers</span></button><button onclick="backup()"><b>JSON backup</b><span>Complete local database backup</span></button></div><div class="sectionTitle">Control</div><div class="card mini"><div class="rowsub">Use Close Day for physical cash reconciliation. Edit any transaction from Activity before closing.</div></div>`;openSheet();setSheetBack(()=>closeSheet())}


function formForExtra(mode){document.getElementById('sheetContent').innerHTML=formFor(mode);openSheet();setSheetBack(()=>mode==='Owner Funding'?owner():mode==='Supplier Credit'?supplier():closeSheet())}
function saveSupplierPayment(id){let p=payables().find(z=>z.id===id),amt=Number(document.getElementById('spAmt')?.value||0);if(!p||amt<=0||amt>p.balance)return alert('Enter an amount up to the outstanding balance');db.transactions.push({id:'tx-'+Date.now(),date:document.getElementById('spDate')?.value||today(),type:'Supplier Payment',description:'Payment to '+(p.party||'Supplier'),amount:amt,category:'Payable Settlement',funding:document.getElementById('spFund').value,party:p.party||'',status:'Paid',referenceId:id});save();supplier()}
render();
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('sheet').classList.contains('open'))closeSheet()});document.getElementById('sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});ensureSheetToolbar();
</script></body></html>
